[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.16.0"

[[redirects]]
  from = "/produk/pdf-tools/:city/"
  to = "/produk/pdf-tools/"
  status = 301
  force = true

# Bekas halaman kota hasil generate massal (500+ per layanan/produk) → 301 ke halaman induk.
# Tanpa `force`: halaman kota yang memang ada (src/content/layanan-kota) tetap dilayani normal,
# hanya URL yang sudah tidak ada yang di-redirect.
[[redirects]]
  from = "/layanan/:service/:city"
  to = "/layanan/:service/"
  status = 301

[[redirects]]
  from = "/produk/:product/:city"
  to = "/produk/:product/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-default.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sitemap-index.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
